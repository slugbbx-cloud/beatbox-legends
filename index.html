<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEATBOX LEGENDS: LEGACY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@300;400;600;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            /* Premium Dark Palette */
            --bg: #050505;
            --surface: #0a0a0a;
            --surface-highlight: #141414;
            --border: #222;
            --text-main: #f0f0f0;
            --text-muted: #666;
            
            /* Accents */
            --gold: #FFD700;
            --gold-dim: #b39700;
            --red: #E63946;
            
            /* Rarity Colors */
            --c-common: #9e9e9e;
            --c-underground: #607d8b;
            --c-rare: #00bcd4;
            --c-epic: #d500f9;
            --c-uk: #ff1744;
            --c-discord: #ff9100;
            --c-loop: #00e676;
            --c-legendary: #ffd700;

            /* Shadows & Effects */
            --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.8);
            --shadow-hard: 0 20px 60px -10px rgba(0,0,0,0.9);
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            /* Premium Noise Texture & Vignette */
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a2e 0%, transparent 80%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0) 100%);
        }

        .brand h1 {
            font-family: 'Teko', sans-serif;
            margin: 0;
            font-size: 2.5rem;
            line-height: 0.9;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.8;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-pill {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 5px 15px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            backdrop-filter: blur(5px);
        }
        .stat-pill span { font-size: 0.55rem; color: var(--text-muted); margin-bottom: 2px; letter-spacing: 1px; }

        .settings-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 42px; height: 42px;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.2rem;
        }
        .settings-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(255, 215, 0, 0.05); }

        /* --- PACK STAGE --- */
        .stage {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            position: relative;
            padding-bottom: 40px; /* Space for reflection */
        }

        .pack-row {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
        }

        .pack {
            width: 220px;
            height: 330px;
            background: #0a0a0a;
            border-radius: 16px;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            will-change: transform;
        }

        /* Pack Hover Effect */
        .pack:not(.locked):hover { 
            transform: translateY(-15px) scale(1.02) rotateX(5deg); 
            box-shadow: var(--shadow-hard), 0 0 20px rgba(255,255,255,0.05);
            border-color: #444;
        }
        
        .pack.opening { animation: packBurst 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; pointer-events: none; }

        .pack.locked {
            filter: grayscale(100%) opacity(0.4);
            cursor: not-allowed;
            border-style: dashed;
        }
        .pack.locked:hover { transform: none; box-shadow: none; }

        .pack-inner {
            position: absolute; inset: 4px;
            background: linear-gradient(145deg, #161616, #080808);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #1a1a1a;
            overflow: hidden;
        }
        
        /* Premium Holographic Sheen */
        .pack-inner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 55%, transparent 60%);
            background-size: 200% 200%;
            animation: holoShift 4s infinite linear;
            pointer-events: none;
        }

        @keyframes holoShift { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes packBurst { 
            0% { transform: scale(1); filter: brightness(1); } 
            40% { transform: scale(0.95) rotateZ(-2deg); filter: brightness(1.5); } 
            100% { transform: scale(1.5); opacity: 0; filter: brightness(2); } 
        }

        .pack-icon { font-size: 4rem; margin-bottom: 15px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); transition: transform 0.3s; }
        .pack:hover .pack-icon { transform: scale(1.1); }
        
        .pack-title { font-family: 'Teko', sans-serif; font-size: 2.2rem; line-height: 0.9; color: var(--text-main); letter-spacing: 1px; }
        .pack-sub { font-size: 0.7rem; color: var(--gold); letter-spacing: 3px; margin-top: 8px; font-weight: 700; opacity: 0.9; }

        .lock-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            border-radius: 12px;
            z-index: 10;
            display: none;
            backdrop-filter: blur(2px);
        }
        .pack.locked .lock-overlay { display: flex; }
        .lock-msg { font-size: 0.7rem; color: #888; margin-top: 10px; width: 80%; text-align: center; font-weight: 600; letter-spacing: 1px; }

        /* --- CARD OVERLAY --- */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(20px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; }

        .pack-results {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 40px 0;
            perspective: 1500px;
        }

        .card-wrapper {
            width: 300px;
            height: 480px;
            flex-shrink: 0;
            transform-style: preserve-3d;
        }

        /* Optimized Card */
        .card {
            width: 100%; height: 100%;
            border-radius: 20px;
            position: relative;
            transform-style: preserve-3d;
            background: #0c0c0c;
            box-shadow: var(--shadow-hard);
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            display: flex; flex-direction: column;
            opacity: 0;
            transform: rotateY(90deg) translateZ(-100px);
            will-change: transform, opacity;
        }
        
        .card.inspect { opacity: 1; transform: rotateY(0deg) translateZ(0); }
        .card.reveal { animation: revealFlip 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards; }

        @keyframes revealFlip { 
            0% { opacity: 0; transform: rotateY(90deg) translateZ(-100px); } 
            100% { opacity: 1; transform: rotateY(0deg) translateZ(0); } 
        }

        .card-top {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 2;
        }

        .rat-circle {
            width: 54px; height: 54px;
            border-bottom: 3px solid currentColor;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Teko', sans-serif;
            font-size: 2.8rem;
            line-height: 0;
            padding-top: 6px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            background: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
            border-radius: 50%;
            backdrop-filter: blur(4px);
        }

        .flag { font-size: 2.2rem; filter: grayscale(0.2) drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .img-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 65%;
            z-index: 1;
            /* Smoother fade to black */
            mask-image: linear-gradient(to bottom, black 50%, transparent 95%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 95%);
            background: #080808; 
        }

        .hero-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease-out;
        }
        .card:hover .hero-img { transform: scale(1.05); }

        .card-bottom {
            margin-top: auto;
            padding: 20px;
            z-index: 2;
            background: linear-gradient(to top, #050505 10%, transparent);
        }

        .card-name {
            font-family: 'Teko', sans-serif;
            font-size: 3.2rem;
            text-transform: uppercase;
            line-height: 0.8;
            margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,1);
        }

        .card-sub {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 15px;
            display: block;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
        }
        .stat-item { text-align: center; }
        .stat-lbl { font-size: 0.6rem; color: #666; font-weight: 700; display: block; margin-bottom: 2px; }
        .stat-val { font-size: 1.2rem; font-family: 'Teko', sans-serif; color: #eee; line-height: 1; }

        /* Buttons */
        .btn {
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 14px 50px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 5px 20px rgba(255,255,255,0.1);
        }
        .btn:hover { 
            background: var(--gold); 
            color: #000; 
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        .btn:active { transform: translateY(0); }
        
        .btn-red { background: var(--red); color: white; box-shadow: 0 5px 20px rgba(230, 57, 70, 0.2); }
        .btn-red:hover { background: #ff5252; box-shadow: 0 10px 30px rgba(230, 57, 70, 0.4); }

        /* --- INVENTORY --- */
        .inventory {
            width: 100%;
            height: 240px;
            background: rgba(10, 10, 10, 0.9);
            border-top: 1px solid var(--border);
            padding: 20px 30px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(15px);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .inv-title { font-size: 0.85rem; color: var(--gold); letter-spacing: 2px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        
        .inv-toggles { display: flex; gap: 8px; }
        .toggle-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            font-family: 'Rajdhani';
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .toggle-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .toggle-btn.active { background: var(--text-main); color: var(--bg); border-color: var(--text-main); box-shadow: 0 2px 10px rgba(255,255,255,0.1); }

        .inv-scroll {
            display: flex; gap: 12px; overflow-x: auto; height: 100%; padding-bottom: 10px;
            /* Smooth scroll */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .inv-scroll::-webkit-scrollbar { height: 6px; }
        .inv-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .inv-scroll::-webkit-scrollbar-track { background: transparent; }

        .inv-card {
            min-width: 110px; height: 100%;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            will-change: transform;
        }
        .inv-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .inv-card.locked { opacity: 0.4; filter: grayscale(100%); pointer-events: none; border-style: dashed; }
        
        .inv-img { width: 100%; height: 75%; object-fit: cover; background: #080808; }
        .inv-info { height: 25%; display: flex; justify-content: center; align-items: center; font-family: 'Teko'; font-size: 1.2rem; color: #fff; background: #0a0a0a; border-top: 1px solid rgba(255,255,255,0.05); }
        .inv-badge { position: absolute; top: 4px; right: 4px; background: var(--gold); color: #000; font-size: 0.65rem; padding: 2px 5px; font-weight: 800; border-radius: 3px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* --- SETTINGS MODAL --- */
        #settingsModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: #111;
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal-title { font-family: 'Teko'; font-size: 2.2rem; margin-bottom: 25px; color: var(--text-main); letter-spacing: 2px; }
        .setting-btn { width: 100%; margin-top: 15px; padding: 12px; }

        /* --- SCANNER ANIM --- */
        #scanner {
            position: fixed; inset: 0; background: black; z-index: 150; display: none;
            justify-content: center; align-items: center;
        }
        .scan-beam {
            width: 100%; height: 2px; background: var(--gold);
            box-shadow: 0 0 50px var(--gold), 0 0 100px white;
            animation: scan 1.2s ease-in-out infinite;
        }
        @keyframes scan { 0% { transform: translateY(-50vh) scaleX(0.5); opacity: 0; } 50% { opacity: 1; transform: translateY(0) scaleX(1); } 100% { transform: translateY(50vh) scaleX(0.5); opacity: 0; } }
        
        /* Mobile */
        @media (max-width: 768px) {
            .pack-results { flex-direction: column; justify-content: flex-start; padding-top: 60px; }
            .card-wrapper { height: 380px; width: 240px; margin-bottom: 30px; transform: none; }
            .pack-row { flex-direction: column; gap: 30px; }
            .pack { width: 180px; height: 260px; }
            h1 { font-size: 2.2rem; }
            .stats-bar span { display: none; }
        }

    </style>
</head>
<body>

    <!-- AUDIO SOURCE - AUTO PLAY ON DOG PACK -->
    <audio id="dogAudio" src="1st take freestyle.mp3"></audio>

    <header>
        <div class="brand">
            <h1>BEATBOX LEGENDS</h1>
            <div class="subtitle">LEGACY COLLECTION</div>
        </div>
        <div class="stats-bar">
            <div class="stat-pill">
                <div id="totalOpenedDisplay" style="color:var(--text-main); font-size:1.2rem;">0</div>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙</button>
        </div>
    </header>

    <div class="stage">
        <div class="pack-row">
            <!-- 1 Card Pack (Always Unlocked) -->
            <div class="pack" onclick="openPack(1)">
                <div class="pack-inner">
                    <div class="pack-icon">👤</div>
                    <div class="pack-title">SOLO</div>
                    <div class="pack-sub">1 CARD</div>
                </div>
            </div>

            <!-- 3 Card Pack (Unlock @ 10) -->
            <div class="pack" id="pack3" onclick="openPack(3)">
                <div class="lock-overlay">
                    <div style="font-size:2rem; margin-bottom:5px;">🔒</div>
                    <div class="lock-msg">OPEN 10 CARDS</div>
                </div>
                <div class="pack-inner">
                    <div class="pack-icon">💠</div>
                    <div class="pack-title">TRIPLE</div>
                    <div class="pack-sub">3 CARDS</div>
                </div>
            </div>

            <!-- 5 Card Pack (Unlock @ 25) -->
            <div class="pack" id="pack5" onclick="openPack(5)" style="border-color: var(--gold); box-shadow:var(--glow-gold);">
                <div class="lock-overlay">
                    <div style="font-size:2rem; margin-bottom:5px;">🔒</div>
                    <div class="lock-msg">OPEN 25 CARDS</div>
                </div>
                <div class="pack-inner">
                    <div class="pack-icon" style="color:var(--gold)">🔥</div>
                    <div class="pack-title" style="color:var(--gold)">MEGA</div>
                    <div class="pack-sub">5 CARDS</div>
                </div>
            </div>
        </div>
    </div>

    <div id="scanner"><div class="scan-beam"></div></div>

    <div class="overlay" id="overlay">
        <div class="pack-results" id="resultsArea"></div>
        <button class="btn" id="closeBtn" onclick="closeOverlay()">COLLECT ALL</button>
    </div>

    <div id="settingsModal">
        <div class="modal-box">
            <div class="modal-title">SETTINGS</div>
            <!-- Audio Toggle Removed per instruction -->
            <button class="btn btn-red setting-btn" onclick="resetProgress()">RESET PROGRESS</button>
            <button class="btn setting-btn" onclick="toggleSettings()">CLOSE</button>
        </div>
    </div>

    <div class="inventory">
        <div class="inv-header">
            <div class="inv-title">COLLECTION <span id="clubCount" style="color:var(--text-muted); margin-left:5px;">(0)</span></div>
            <div class="inv-toggles">
                <button class="toggle-btn active" id="btnOwned" onclick="setView('owned')">OWNED</button>
                <button class="toggle-btn" id="btnIndex" onclick="setView('all')">INDEX</button>
            </div>
        </div>
        <div class="inv-scroll" id="invList"></div>
    </div>

<script>
    // --- OPTIMIZED SOUND ENGINE ---
    const SoundFX = {
        ctx: null,
        init: function() {
            if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if(this.ctx.state === 'suspended') this.ctx.resume();
        },
        play: function(type) {
            if(!this.ctx) this.init();
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(600, t);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.start(t);
                osc.stop(t + 0.1);
            } else if (type === 'charge') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(800, t + 0.5);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.linearRampToValueAtTime(0.2, t + 0.4);
                gain.gain.linearRampToValueAtTime(0, t + 0.5);
                osc.start(t);
                osc.stop(t + 0.5);
            } else if (type === 'burst') {
                // Synthesized noise burst
                const bSize = this.ctx.sampleRate * 0.5;
                const b = this.ctx.createBuffer(1, bSize, this.ctx.sampleRate);
                const d = b.getChannelData(0);
                for(let i=0;i<bSize;i++) d[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = b;
                const filt = this.ctx.createBiquadFilter();
                filt.type = 'lowpass';
                filt.frequency.value = 800;
                src.connect(filt);
                filt.connect(gain);
                gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                src.start(t);
            } else if (type === 'reveal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                osc.start(t);
                osc.stop(t + 0.2);
            }
        }
    };

    let myCollection = JSON.parse(localStorage.getItem('myCollection')) || {};
    let totalOpened = parseInt(localStorage.getItem('totalOpened')) || 0;
    let viewMode = 'owned';
    
    const overlay = document.getElementById('overlay');
    const resultsArea = document.getElementById('resultsArea');
    const scanner = document.getElementById('scanner');
    const dogAudio = document.getElementById('dogAudio');
    const closeBtn = document.getElementById('closeBtn');
    const totalDisplay = document.getElementById('totalOpenedDisplay');
    const settingsModal = document.getElementById('settingsModal');

    function initApp() {
        document.body.addEventListener('click', () => { SoundFX.init(); }, { once: true });
        totalDisplay.innerText = totalOpened;
        checkUnlocks();
        updateInv();
    }

    function checkUnlocks() {
        if (totalOpened >= 10) document.getElementById('pack3').classList.remove('locked');
        else document.getElementById('pack3').classList.add('locked');
        if (totalOpened >= 25) document.getElementById('pack5').classList.remove('locked');
        else document.getElementById('pack5').classList.add('locked');
    }

    function openPack(numCards) {
        if ((numCards === 3 && totalOpened < 10) || (numCards === 5 && totalOpened < 25)) return;
        
        SoundFX.play('click');
        const packIndex = numCards === 1 ? 0 : (numCards === 3 ? 1 : 2);
        const activePack = document.querySelectorAll('.pack')[packIndex];

        if(activePack.classList.contains('opening')) return;
        
        activePack.classList.add('opening');
        SoundFX.play('charge');

        setTimeout(() => {
            activePack.classList.remove('opening');
            SoundFX.play('burst');
            revealLogic(numCards);
        }, 600);
    }

    function revealLogic(numCards) {
        const openedCards = [];
        let hasSpecial = false;
        let hasDog = false;

        for(let i=0; i<numCards; i++) {
            totalOpened++;
            const r = Math.random() * 100;
            let pool = [];

            if(r < 1) pool = db.filter(x => x.name === 'DOG'); 
            else if(r < 5) pool = db.filter(x => x.rarity === 'legendary');
            else if (r < 12) pool = db.filter(x => x.rarity === 'loop-master');
            else if (r < 25) pool = db.filter(x => x.rarity === 'epic');
            else if (r < 55) pool = db.filter(x => x.rarity === 'uk-scene'); 
            else pool = db.filter(x => x.rarity === 'underground' || x.rarity === 'common');

            if(pool.length === 0) pool = db;
            const card = pool[Math.floor(Math.random() * pool.length)];
            openedCards.push(card);

            if(myCollection[card.name]) myCollection[card.name].count++;
            else myCollection[card.name] = { ...card, count: 1 };

            if(card.rarity === 'legendary' || card.rarity === 'loop-master') hasSpecial = true;
            if(card.name === 'DOG') hasDog = true;
        }

        localStorage.setItem('myCollection', JSON.stringify(myCollection));
        localStorage.setItem('totalOpened', totalOpened);
        totalDisplay.innerText = totalOpened;
        checkUnlocks();

        if(hasSpecial) {
            triggerScanner(openedCards, hasDog);
        } else {
            showCards(openedCards, hasDog);
        }
    }

    function triggerScanner(cards, hasDog) {
        scanner.style.display = 'flex';
        // Simulate scanner sound loop or effect here if desired
        setTimeout(() => {
            scanner.style.display = 'none';
            showCards(cards, hasDog);
        }, 1200);
    }

    function createCardElement(card, index, isInspection = false) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        if(!isInspection) wrapper.style.animationDelay = `${index * 0.1}s`;

        const cardDiv = document.createElement('div');
        cardDiv.className = isInspection ? `card inspect` : `card reveal`;
        cardDiv.style.borderColor = getBorderColor(card.rarity);
        
        // --- SMART IMAGE ENGINE ---
        let imgSrc = '';
        if (card.img && (card.img.includes('http') || card.img.includes('.png') || card.img.includes('.jpg'))) {
            // Local file or direct full URL (e.g. Wiki or local)
            if (card.img.includes('youtube.com')) {
                // Should not happen with new logic, but safe guard:
                // Extract ID if full URL somehow passed? No, we store IDs or full URLs.
                // If it is a full URL to an image, use it.
                imgSrc = card.img;
            } else if (!card.img.includes('http')) {
                // It is a video ID
                imgSrc = `https://img.youtube.com/vi/${card.img}/maxresdefault.jpg`;
            } else {
                imgSrc = card.img; // Direct URL (Wiki or Local)
            }
        } else if (card.img && !card.img.includes('placeholder')) {
             // It's a video ID
             imgSrc = `https://img.youtube.com/vi/${card.img}/maxresdefault.jpg`;
        } else {
            // Placeholder fallback
            imgSrc = `https://ui-avatars.com/api/?name=${card.name}&background=151515&color=fff&size=512&bold=true`;
        }

        const color = getTxtColor(card.rarity);

        cardDiv.innerHTML = `
            <div class="foil-layer"></div>
            <div class="card-top">
                <div class="rat-circle" style="color:${color}; border-color:${color}">${card.rating}</div>
                <div class="flag">${card.country}</div>
            </div>
            <div class="img-mask">
                <img src="${imgSrc}" class="hero-img" onerror="smartFallback(this, '${card.name}')">
            </div>
            <div class="card-bottom">
                <h2 class="card-name">${card.name}</h2>
                <span class="card-sub" style="color:${color}">${card.type}</span>
                <div class="stats-row">
                    <div class="stat-item"><span class="stat-lbl">TEC</span><span class="stat-val">${card.t}</span></div>
                    <div class="stat-item"><span class="stat-lbl">MUS</span><span class="stat-val">${card.m}</span></div>
                    <div class="stat-item"><span class="stat-lbl">ORG</span><span class="stat-val">${card.o}</span></div>
                    <div class="stat-item"><span class="stat-lbl">PWR</span><span class="stat-val">${card.p}</span></div>
                </div>
            </div>
        `;
        
        if(!isInspection) {
            setTimeout(() => { SoundFX.play('reveal'); }, index * 100 + 200);
        }

        wrapper.appendChild(cardDiv);
        return wrapper;
    }

    window.smartFallback = function(img, name) {
        // Fallback chain: MaxRes -> HQ -> Avatar
        if (img.src.includes('maxresdefault')) {
            img.src = img.src.replace('maxresdefault', 'hqdefault');
        } else {
            img.onerror = null;
            img.src = "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=600&auto=format&fit=crop";
        }
    }

    function showCards(cards, hasDog) {
        overlay.classList.add('active');
        overlay.style.display = 'flex';
        resultsArea.innerHTML = '';
        
        // Efficient DOM insertion
        const frag = document.createDocumentFragment();
        cards.forEach((card, index) => {
            frag.appendChild(createCardElement(card, index));
        });
        resultsArea.appendChild(frag);
        
        updateInv();

        if(hasDog) {
            dogAudio.currentTime = 27;
            dogAudio.volume = 1.0; 
            dogAudio.play().catch(e => console.log("Audio autostart prevented"));
        }
    }

    function inspectCard(cardName) {
        SoundFX.play('click');
        const card = db.find(c => c.name === cardName);
        if(!card || (viewMode === 'all' && !myCollection[cardName])) return;

        overlay.classList.add('active');
        overlay.style.display = 'flex';
        resultsArea.innerHTML = '';
        resultsArea.appendChild(createCardElement(card, 0, true));
        closeBtn.innerText = "CLOSE";
    }

    function closeOverlay() {
        SoundFX.play('click');
        overlay.classList.remove('active');
        setTimeout(() => { overlay.style.display = 'none'; resultsArea.innerHTML = ''; }, 200);
        dogAudio.pause();
        dogAudio.currentTime = 0;
        closeBtn.innerText = "COLLECT ALL";
    }

    function setView(mode) {
        SoundFX.play('click');
        viewMode = mode;
        document.getElementById('btnOwned').className = mode === 'owned' ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('btnIndex').className = mode === 'all' ? 'toggle-btn active' : 'toggle-btn';
        updateInv();
    }

    function updateInv() {
        const list = document.getElementById('invList');
        // Simple wipe is fine for this scale, can optimize if thousands of items
        list.innerHTML = '';
        
        let cardsToShow = [];
        if (viewMode === 'owned') {
            cardsToShow = Object.values(myCollection).sort((a,b) => b.rating - a.rating);
        } else {
            cardsToShow = db.map(card => {
                const owned = myCollection[card.name];
                return { ...card, count: owned ? owned.count : 0, isLocked: !owned };
            }).sort((a,b) => b.rating - a.rating);
        }

        const totalOwned = Object.values(myCollection).length;
        document.getElementById('clubCount').innerText = `(${totalOwned})`;

        const frag = document.createDocumentFragment();
        cardsToShow.forEach(c => {
            const div = document.createElement('div');
            div.className = c.isLocked ? 'inv-card locked' : 'inv-card';
            div.style.borderColor = getBorderColor(c.rarity);
            div.onclick = () => inspectCard(c.name);
            
            const img = document.createElement('img');
            img.className = 'inv-img';
            
            // Image logic repeated for consistency
            if (c.img && (c.img.includes('.png') || c.img.includes('.jpg'))) {
                if (c.img.includes('http')) img.src = c.img; // Wiki/External
                else img.src = c.img; // Local
            } else if (c.img && !c.img.includes('placeholder')) {
                img.src = `https://img.youtube.com/vi/${c.img}/mqdefault.jpg`;
            } else {
                img.src = `https://ui-avatars.com/api/?name=${c.name}&background=111&color=fff`;
            }
            
            img.onerror = function() {
               if(this.src.includes('mqdefault')) this.src = this.src.replace('mqdefault', 'default');
               else { this.onerror = null; this.src = "https://images.unsplash.com/photo-1516280440614-6697288d5d38?q=80&w=200&auto=format&fit=crop"; }
            };

            const ratingDisplay = c.isLocked ? "??" : c.rating;
            const badgeDisplay = c.count > 1 ? `<span class="inv-badge">${c.count}</span>` : '';

            div.innerHTML = `
                ${badgeDisplay}
                <div class="inv-info" style="color:${getTxtColor(c.rarity)}">${ratingDisplay}</div>
            `;
            div.prepend(img);
            frag.appendChild(div);
        });
        list.appendChild(frag);
    }

    function toggleSettings() {
        SoundFX.play('click');
        const d = settingsModal.style.display;
        settingsModal.style.display = d === 'flex' ? 'none' : 'flex';
    }

    function resetProgress() {
        SoundFX.play('click');
        if(confirm('Reset entire collection?')) {
            localStorage.clear();
            location.reload();
        }
    }

    function getBorderColor(r) {
        if(r === 'legendary') return '#ffd700';
        if(r === 'loop-master') return '#00e676';
        if(r === 'uk-scene') return '#ff1744';
        if(r === 'epic') return '#d500f9';
        return '#888';
    }

    function getTxtColor(r) {
        if(r === 'legendary') return '#ffe57f';
        if(r === 'loop-master') return '#b9f6ca';
        if(r === 'uk-scene') return '#ff8a80';
        if(r === 'epic') return '#ea80fc';
        return '#bdbdbd';
    }

    // START
    initApp();
