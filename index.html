<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS: PRO BEATBOX TRADING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@300;500;700&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --bg-deep: #050505;
            
            /* Rarity Gradients */
            --g-common: linear-gradient(135deg, #757575, #9e9e9e);
            --g-underground: linear-gradient(135deg, #455a64, #607d8b);
            --g-rare: linear-gradient(135deg, #0097a7, #00bcd4);
            --g-epic: linear-gradient(135deg, #7b1fa2, #e040fb);
            --g-uk: linear-gradient(135deg, #c62828, #ff1744);
            --g-discord: linear-gradient(135deg, #e65100, #ff9100);
            --g-loop: linear-gradient(135deg, #1b5e20, #00e676);
            --g-legendary: linear-gradient(135deg, #ff6f00, #ffd700, #ffecb3);
            
            /* Text Colors */
            --c-common: #bdbdbd;
            --c-underground: #90a4ae;
            --c-rare: #80deea;
            --c-epic: #ea80fc;
            --c-uk: #ff8a80;
            --c-discord: #ffcc80;
            --c-loop: #b9f6ca;
            --c-legendary: #ffe57f;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a2e 0%, transparent 60%),
                repeating-linear-gradient(rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 20px);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            margin: 0;
            font-size: 3rem;
            line-height: 0.8;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 6px;
            color: var(--c-rare);
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* --- PACK STAGE --- */
        .stage {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            position: relative;
        }

        .pack-row {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
        }

        .pack {
            width: 220px;
            height: 320px;
            background: #111;
            border-radius: 18px;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: float 6s ease-in-out infinite;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .pack:nth-child(2) { animation-delay: 1s; border-color: var(--c-rare); box-shadow: 0 0 50px rgba(0, 188, 212, 0.2); }

        .pack:hover { transform: scale(1.05) rotateX(5deg); }
        .pack.opening { animation: packBurst 0.8s forwards; }

        .pack-art {
            position: absolute; inset: 4px;
            background: linear-gradient(135deg, #1a1a1a, #000);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #222;
            overflow: hidden;
        }
        
        /* Pack Hologram */
        .pack-art::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(125deg, transparent 20%, rgba(255,255,255,0.1) 30%, transparent 40%);
            animation: shine 4s infinite;
        }

        @keyframes shine { 0% { transform: translateX(-100%); } 20%, 100% { transform: translateX(100%); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes packBurst { 
            0% { transform: scale(1); filter: brightness(1); } 
            50% { transform: scale(0.9); filter: brightness(5); } 
            100% { transform: scale(2); opacity: 0; } 
        }

        /* --- CARD OVERLAY --- */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .pack-results {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            padding: 20px 0;
        }

        .card-wrapper {
            width: 300px;
            height: 480px;
            perspective: 1500px;
            flex-shrink: 0;
        }

        .card {
            width: 100%; height: 100%;
            border-radius: 24px;
            position: relative;
            transform-style: preserve-3d;
            background: #161616;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            display: flex; flex-direction: column;
            opacity: 0;
            transform: rotateY(90deg);
        }

        .card.reveal { animation: revealFlip 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards; }

        @keyframes revealFlip { from { opacity: 0; transform: rotateY(90deg) scale(0.8); } to { opacity: 1; transform: rotateY(0deg) scale(1); } }

        /* Holo Foil Effect */
        .foil-layer {
            position: absolute; inset: 0; z-index: 5;
            background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.15) 40%, rgba(255,255,255,0.05) 60%, transparent 80%);
            mix-blend-mode: overlay;
            pointer-events: none;
            opacity: 0.6;
            background-size: 200% 200%;
            animation: foilMove 5s infinite linear;
        }
        @keyframes foilMove { 0% { background-position: 0% 0%; } 100% { background-position: 200% 200%; } }

        .card-top {
            padding: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 2;
        }

        .rat-circle {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Teko', sans-serif;
            font-size: 2.4rem;
            line-height: 0;
            padding-top: 4px;
            backdrop-filter: blur(4px);
        }

        .flag { font-size: 2rem; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }

        .img-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 60%;
            z-index: 1;
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            background: #111; /* Fallback bg */
        }

        .hero-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card-bottom {
            margin-top: auto;
            padding: 15px;
            z-index: 2;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 50%, transparent 100%);
        }

        .card-name {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            line-height: 0.8;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .card-sub {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 10px;
            display: block;
        }

        .stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-item { text-align: center; display: flex; flex-direction: column; }
        .stat-lbl { font-size: 0.5rem; color: #888; font-weight: 900; }
        .stat-val { font-size: 1rem; font-family: 'Teko', sans-serif; }

        /* Buttons */
        .btn {
            margin-top: 10px;
            padding: 15px 50px;
            background: white;
            color: black;
            border: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 200;
        }
        .btn:hover { transform: scale(1.05); background: var(--c-rare); }

        /* --- INVENTORY --- */
        .inventory {
            width: 100%;
            height: 180px;
            background: rgba(10, 10, 15, 0.9);
            border-top: 1px solid #333;
            backdrop-filter: blur(10px);
            padding: 15px;
            z-index: 10;
        }
        .inv-header { font-size: 0.8rem; color: #666; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700; }
        .inv-scroll {
            display: flex; gap: 10px; overflow-x: auto; height: 120px; padding-bottom: 10px;
        }
        .inv-card {
            min-width: 90px; height: 100%;
            background: #202020;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .inv-img { width: 100%; height: 70%; object-fit: cover; }
        .inv-info { height: 30%; display: flex; justify-content: center; align-items: center; font-family: 'Teko'; font-size: 1.2rem; background: #111; color: white; }
        .inv-badge { position: absolute; top: 2px; right: 2px; background: white; color: black; font-size: 0.6rem; padding: 1px 4px; font-weight: bold; border-radius: 2px; }

        /* --- RARITY THEMES --- */
        .t-legendary { color: var(--c-legendary); }
        .b-legendary { border-color: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
        
        .t-uk { color: var(--c-uk); }
        .b-uk { border-color: #ff1744; box-shadow: 0 0 25px rgba(255, 23, 68, 0.3); }
        
        .t-loop { color: var(--c-loop); }
        .b-loop { border-color: #00e676; }
        
        .t-epic { color: var(--c-epic); }
        .b-epic { border-color: #d500f9; }

        /* --- SCANNER ANIM --- */
        #scanner {
            position: fixed; inset: 0; background: black; z-index: 200; display: none;
            justify-content: center; align-items: center;
        }
        .scan-beam {
            width: 100%; height: 4px; background: #00f2ff;
            box-shadow: 0 0 50px #00f2ff, 0 0 100px white;
            animation: scan 1.2s ease-in-out infinite;
        }
        @keyframes scan { 0% { transform: translateY(-50vh) scaleX(0.5); opacity: 0; } 50% { opacity: 1; transform: translateY(0) scaleX(1); } 100% { transform: translateY(50vh) scaleX(0.5); opacity: 0; } }
        
        /* Mobile Adjustments for 3 cards */
        @media (max-width: 768px) {
            .pack-results {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 40px;
            }
            .card-wrapper {
                height: 400px;
                width: 260px;
                transform: scale(0.95);
                margin-bottom: 20px;
            }
            .pack-row {
                flex-direction: column;
                gap: 20px;
            }
        }

    </style>
</head>

        { name: "Improver", rating: 94, country: "🇷🇺", rarity: "epic", type: "UNIQUE", t:95, m:92, o:98, p:90, img: "QbOC9OGH45E" },
        { name: "Abo Ice", rating: 91, country: "🇸🇦", rarity: "epic", type: "AGGRO", t:92, m:85, o:89, p:95, img: "a8q2J5v5vM" },
        { name: "Helium", rating: 92, country: "🇷🇺", rarity: "epic", type: "DEEP", t:89, m:88, o:90, p:95, img: "h2q2J5v5vM" },
        { name: "Zekka", rating: 92, country: "🇪🇸", rarity: "epic", type: "FAST", t:95, m:89, o:90, p:93, img: "z3q2J5v5vM" },

        // --- DISCORD/UNDERGROUND ---
        { name: "Vocodah", rating: 91, country: "🇺🇸", rarity: "discord-gem", type: "BASS", t:95, m:82, o:96, p:97, img: "v4q2J5v5vM" },
        { name: "Wunknown", rating: 86, country: "🇺🇸", rarity: "underground", type: "DEEP", t:85, m:80, o:90, p:85, img: "w2q2J5v5vM" },
        { name: "Voiid", rating: 87, country: "🇺🇸", rarity: "underground", type: "BASS", t:85, m:83, o:92, p:94, img: "v8q2J5v5vM" },
        { name: "Impedance", rating: 85, country: "🇺🇸", rarity: "underground", type: "BASS", t:83, m:80, o:88, p:92, img: "i9q2J5v5vM" }
    ];

    let myCollection = {};
    const overlay = document.getElementById('overlay');
    const resultsArea = document.getElementById('resultsArea');
    const scanner = document.getElementById('scanner');
    const dogAudio = document.getElementById('dogAudio');

    function openPack(numCards) {
        // Animate correct pack
        let packIndex = 0;
        if (numCards === 3) packIndex = 1;
        if (numCards === 5) packIndex = 2;

        const packs = document.querySelectorAll('.pack');
        const activePack = packs[packIndex];

        if(activePack.classList.contains('opening')) return;
        
        activePack.classList.add('opening');
        setTimeout(() => {
            activePack.classList.remove('opening');
            revealLogic(numCards);
        }, 800);
    }

    function revealLogic(numCards) {
        const openedCards = [];
        let hasSpecial = false;
        let hasDog = false;

        for(let i=0; i<numCards; i++) {
            // RNG
            const r = Math.random() * 100;
            let pool = [];

            // ADJUSTED ODDS: DOG IS NOW ULTRA RARE (1%)
            if(r < 1) pool = db.filter(x => x.name === 'DOG'); 
            else if(r < 5) pool = db.filter(x => x.rarity === 'legendary');
            else if (r < 12) pool = db.filter(x => x.rarity === 'loop-master');
            else if (r < 25) pool = db.filter(x => x.rarity === 'epic');
            else if (r < 55) pool = db.filter(x => x.rarity === 'uk-scene'); 
            else pool = db.filter(x => x.rarity === 'underground' || x.rarity === 'common');

            if(pool.length === 0) pool = db;
            
            const card = pool[Math.floor(Math.random() * pool.length)];
            openedCards.push(card);

            if(card.rarity === 'legendary' || card.rarity === 'loop-master') {
                hasSpecial = true;
            }
            if(card.name === 'DOG') {
                hasDog = true;
                hasSpecial = true;
            }
        }

        if(hasSpecial) {
            triggerScanner(openedCards, hasDog);
        } else {
            showCards(openedCards, hasDog);
        }
    }

    function triggerScanner(cards, hasDog) {
        scanner.style.display = 'flex';
        setTimeout(() => {
            scanner.style.display = 'none';
            showCards(cards, hasDog);
        }, 1200);
    }

    function createCardElement(card, index) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.style.animationDelay = `${index * 0.2}s`;

        const cardDiv = document.createElement('div');
        cardDiv.className = `card reveal b-${card.rarity.split('-')[0]}`;
        
        let imgSrc = `https://ui-avatars.com/api/?name=${card.name}&background=151515&color=fff&size=512&bold=true`;
        
        // Revised Logic for Custom Local Files vs YouTube
        if(card.img && card.img !== 'placeholder') {
            if (card.img.includes('http') || card.img.includes('.png') || card.img.includes('.jpg')) {
                imgSrc = card.img; // Direct URL or Local File
            } else {
                imgSrc = `https://img.youtube.com/vi/${card.img}/maxresdefault.jpg`; // YouTube ID
            }
        }

        cardDiv.innerHTML = `
            <div class="foil-layer"></div>
            <div class="card-top">
                <div class="rat-circle t-${card.rarity.split('-')[0]}">${card.rating}</div>
                <div class="flag">${card.country}</div>
            </div>
            <div class="img-mask">
                <img src="${imgSrc}" class="hero-img" onload="checkImg(this)" onerror="fallbackImg(this, '${card.name}')">
            </div>
            <div class="card-bottom">
                <h2 class="card-name">${card.name}</h2>
                <span class="card-sub t-${card.rarity.split('-')[0]}">${card.type}</span>
                <div class="stats-row">
                    <div class="stat-item"><span class="stat-lbl">TEC</span><span class="stat-val">${card.t}</span></div>
                    <div class="stat-item"><span class="stat-lbl">MUS</span><span class="stat-val">${card.m}</span></div>
                    <div class="stat-item"><span class="stat-lbl">ORG</span><span class="stat-val">${card.o}</span></div>
                    <div class="stat-item"><span class="stat-lbl">PWR</span><span class="stat-val">${card.p}</span></div>
                </div>
            </div>
        `;
        wrapper.appendChild(cardDiv);
        return wrapper;
    }

    window.checkImg = function(img) { }

    window.fallbackImg = function(img, name) {
        if (img.src.includes('maxresdefault')) {
            img.src = img.src.replace('maxresdefault', 'hqdefault');
        } else {
            img.onerror = null;
            img.src = `https://ui-avatars.com/api/?name=${name}&background=151515&color=fff&size=512&bold=true`;
        }
    }

    function showCards(cards, hasDog) {
        resultsArea.innerHTML = '';
        cards.forEach((card, index) => {
            resultsArea.appendChild(createCardElement(card, index));
            if(myCollection[card.name]) myCollection[card.name].count++;
            else myCollection[card.name] = { ...card, count: 1 };
        });
        
        updateInv();
        overlay.style.display = 'flex';

        if(hasDog) {
            // Start audio at 27 seconds
            dogAudio.currentTime = 27;
            dogAudio.play().catch(e => console.log("Audio play failed (interaction needed?):", e));
        }
    }

    function closeOverlay() {
        overlay.style.display = 'none';
        resultsArea.innerHTML = '';
        dogAudio.pause();
        dogAudio.currentTime = 0; // Reset for next time
    }

    function updateInv() {
        const list = document.getElementById('invList');
        list.innerHTML = '';
        
        const sorted = Object.values(myCollection).sort((a,b) => b.rating - a.rating);
        let total = 0;

        sorted.forEach(c => {
            total++;
            const div = document.createElement('div');
            div.className = 'inv-card';
            div.style.borderColor = getBorderColor(c.rarity);
            
            const img = document.createElement('img');
            img.className = 'inv-img';
            
            // Same logic for inventory
            if(c.img && c.img !== 'placeholder') {
                if (c.img.includes('http') || c.img.includes('.png') || c.img.includes('.jpg')) {
                    img.src = c.img;
                } else {
                    img.src = `https://img.youtube.com/vi/${c.img}/mqdefault.jpg`;
                }
            } else {
                img.src = `https://ui-avatars.com/api/?name=${c.name}&background=111&color=fff`;
            }

            div.innerHTML = `
                ${c.count > 1 ? `<span class="inv-badge">${c.count}</span>` : ''}
                <div class="inv-info" style="color:${getTxtColor(c.rarity)}">${c.rating}</div>
            `;
            div.prepend(img);
            list.appendChild(div);
        });
        document.getElementById('clubCount').innerText = `(${total})`;
    }

    function getBorderColor(r) {
        if(r === 'legendary') return '#ffd700';
        if(r === 'loop-master') return '#00e676';
        if(r === 'uk-scene') return '#ff1744';
        if(r === 'epic') return '#d500f9';
        return '#888';
    }

    function getTxtColor(r) {
        if(r === 'legendary') return '#ffe57f';
        if(r === 'loop-master') return '#b9f6ca';
        if(r === 'uk-scene') return '#ff8a80';
        if(r === 'epic') return '#ea80fc';
        return '#bdbdbd';
    }
</script>
